<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <style>
      html {
        background: #000;
        color-scheme: dark;
      }
      /* A first visit opens on the welcome screen, so the player frame stays out of it. */
      html.first .shell {
        display: none;
      }
    </style>
    <script>
      try {
        if (!localStorage.getItem('garsae.last') && !location.hash) document.documentElement.classList.add('first');
      } catch {}
      // Big windows scale the whole app up, as browser zoom would: the layout is drawn for about
      // 1480 x 740 and a 1920 x 1080 screen shows it at 130%. Viewport units and the short-window
      // rules then follow the zoomed size, set here because CSS media queries only see the real one.
      (() => {
        const root = document.documentElement;
        const fit = () => {
          const w = innerWidth;
          const h = innerHeight;
          const z = Math.min(2, Math.max(1, Math.min(w / 1480, h / 740)));
          const zoomed = z > 1.01;
          root.style.setProperty('--zoom', zoomed ? z.toFixed(3) : '1');
          if (zoomed) {
            root.style.setProperty('--vh', `${h / z / 100}px`);
            root.style.setProperty('--dvh', `${h / z / 100}px`);
          } else {
            root.style.removeProperty('--vh');
            root.style.removeProperty('--dvh');
          }
          const effective = zoomed ? h / z : h;
          root.classList.toggle('short', effective <= 960);
          root.classList.toggle('shorter', effective <= 800);
        };
        fit();
        addEventListener('resize', fit);
      })();
    </script>
    <meta name="description" content="Background music for working, synthesized in your browser as it plays." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Garsæ" />
    <meta property="og:title" content="Garsæ: background music for working" />
    <meta property="og:description" content="Pick instruments and Garsæ plays them, composing as it goes. Synthesized in your browser, so it never loops." />
    <meta property="og:url" content="https://garsae.ranonis.lt/" />
    <meta property="og:image" content="https://garsae.ranonis.lt/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Garsæ wordmark over dark bands of blue." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Garsæ</title>
  </head>
  <body>
    <div id="root">
      <!-- Static first paint, replaced as soon as the app mounts. -->
      <div class="app shell">
        <div class="sidebar glass" aria-hidden="true">
          <div class="transport glass">
            <span class="mark-link">
              <span class="wordmark">Garsæ</span>
            </span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
